{{- /*
  The wordmark: the lemur brand mark (a single static frame traced from
  the site's lemur illustration, see sprite.html) to the left of an
  italic-serif name. DESIGN.md documents this as the canonical brand mark.
*/ -}}
<a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">
  <svg class="brand-mark" width="16" height="24" aria-hidden="true"><use href="#folio-lemur-mark"/></svg>
  <span class="brand-wordmark">{{ site.Title }}</span>
</a>
