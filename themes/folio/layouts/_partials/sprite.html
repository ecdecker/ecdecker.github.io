{{- /*
  Inline SVG symbol sprite. Referenced via <use href="#id">, which is how
  the source pack's own pages do it (html/cover.html, html/preview.html).

  Inlining keeps the rendered site free of JavaScript — the source preview
  page pulled in the Lucide CDN script purely to draw two icons.
*/ -}}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
{{- if or .IsHome .IsPage -}}
  <symbol id="folio-spark" viewBox="0 0 432 432">
    <path fill="currentColor" d="M216,432c-.18-13.79-2.8-102.4-76.16-164.79C82.92,218.8,18.59,216.11,0,216c20.21-2.56,95.8-14.6,154.94-80.75C202.81,81.7,213.2,22.58,216,0c3.09,22.87,14.19,81.83,62.37,135.25,58.72,65.1,132.78,77.88,153.63,80.75-16.83.58-88.56,4.92-148.38,63.03-62.78,60.99-67.08,137.11-67.62,152.97Z"/>
  </symbol>
{{- end -}}

  {{- /* The brand mark's resting frame (turning-00) used to live here as an
         inline <symbol>, duplicating the ~5.5KB traced path into every
         page. It is unused by anything else, so it now lives only as the
         external asset copied by brand.html and painted with CSS
         mask-image — see DESIGN.md and brand.html's own comment. */}}

{{- if .IsHome -}}
  {{- /* Duke wordmark: a simple block "D" monogram, not a reproduction of
         Duke's registered athletics crest. Used only on the Duke Research
         Profile CTA, paired with Duke Blue via .btn--duke. */}}
  <symbol id="logo-duke" viewBox="0 0 24 24">
    <path fill="currentColor" fill-rule="evenodd" d="M4 4h8a8 8 0 0 1 0 16H4Zm4 4v8h4a4 4 0 0 0 0-8Z"/>
  </symbol>

  {{- /* @license lucide-static v1.14.0 - ISC */}}
  <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
  </symbol>
  <symbol id="i-stethoscope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 2v2"/><path d="M5 2v2"/>

  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  {{- /* Fallback drawn by home.html when a principle key has no entry in
         folio.principleIcons. */}}
