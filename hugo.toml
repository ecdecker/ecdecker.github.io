baseURL = 'https://example.org/'
title = 'Folio'
theme = 'folio'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# Default language at /posts/<slug>/, translations at /<lang>/posts/<slug>/
[languages]
  [languages.en]
    locale = 'en-US'
    label = 'English'
    title = 'Folio'
    weight = 1
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Index'
        pageRef = '/'
        weight = 10
      [[languages.en.menus.main]]
        name = 'Notes'
        pageRef = '/posts'
        weight = 20
  [languages.mg]
    locale = 'mg-MG'
    label = 'Malagasy'
    title = 'Folio'
    weight = 2
    [languages.mg.menus]
      [[languages.mg.menus.main]]
        name = 'Fandraisana'
        pageRef = '/'
        weight = 10
      [[languages.mg.menus.main]]
        name = 'Fanamarihana'
        pageRef = '/posts'
        weight = 20
  [languages.fr]
    locale = 'fr-FR'
    label = 'Français'
    title = 'Folio'
    weight = 3
    [languages.fr.menus]
      [[languages.fr.menus.main]]
        name = 'Accueil'
        pageRef = '/'
        weight = 10
      [[languages.fr.menus.main]]
        name = 'Notes'
        pageRef = '/posts'
        weight = 20

# Page-bundle originals are not published. Hugo copies every bundle resource
# into public/ by default, so the multi-megabyte source PNGs shipped alongside
# their own optimized derivatives. With this off, a resource is published only
# when something calls .RelPermalink on it — which the processed variants do
# and the untouched originals do not.
[[cascade]]
  [cascade.build]
    publishResources = false

[params]
  description = 'A quieter way to put things on paper.'

  # Image delivery. AVIF first with a WebP fallback; no original-format
  # source, so WebP is the floor. That excludes only pre-2020 browsers and
  # avoids building the ~1.6 MB PNG variants a third source would need.
  #
  # quality is now only a FALLBACK, for images with no measurement on
  # record. The real value comes per image from data/imagequality.json,
  # written by `tools/measure-image-quality.py --write-data` and read by
  # partials/image.html: each image gets the cheapest q that still holds
  # SSIM >= 0.92 against a lossless reference.
  #
  # That indirection is worth its weight. Reaching the same floor takes
  # q25 on a soft gradient and q70 on a fine-grained texture, so any single
  # value either wastes bytes on the easy images or leaves the hard ones
  # visibly broken. Measured on the field-notes article, per-image
  # targeting ships 382,268 B where a global q70 — the cheapest global
  # setting that clears the floor everywhere — ships 759,996 B.
  #
  # 50 is kept as the fallback for the same reason it was chosen before: it
  # holds the photographic cases at SSIM 0.919-0.954 (q45 dropped a texture
  # to 0.654). Re-run the tool after adding images; an explicit `quality`
  # passed to partials/image.html still overrides everything.
  [params.images]
    quality = 50
    widths = [320, 480, 640, 800, 1200]
  [params.folio]
    volume = 'Volume 01 · 2026'
    headline = 'A quieter way<br>to put things on <em>paper</em>.'
    subtitle = 'Folio is a small, monochrome system for editorial product work. Bone paper, hairline borders, one serif marquee — and nothing else asking for attention.'
    features = [
      'One warm neutral. One ink. No accent colors.',
      'Instrument Serif for marquee, system UI for everything else.',
      '1px hairlines carry every separation.',
      'A single four-point spark, used sparingly.',
    ]
    hint = 'One downloaded family, one system stack.'
    heroImage = 'images/folio-sketchbooks-stem.png'
    heroImageCaption = 'Plate I — Reading shelf'
    tagline = 'A quiet, paper-thin design system. Made on a desk by a window, not in a war room.'
    principlesTitle = 'Three quiet rules.'
    principlesIntro = 'Folio is small on purpose. The whole system runs on a handful of decisions that never get spent on decoration.'

    [params.folio.primaryAction]
      name = 'Read the notes'
      url = '/posts/'
    [params.folio.secondaryAction]
      name = 'View the tags'
      url = '/tags/'

    [[params.folio.principles]]
      icon = 'feather'
      title = 'Set in serif.'
      body = 'Headlines live in Instrument Serif from 32 to 96 pixels. Body uses the native system UI sans at 400/500.'
      meta = 'Type'
    [[params.folio.principles]]
      icon = 'minus'
      title = 'Built on hairlines.'
      body = 'Every divider, card edge, input outline, and table line is a single Mist pixel. Depth is contrast, not shadow.'
      meta = 'Structure'
    [[params.folio.principles]]
      icon = 'layers'
      title = 'One ink only.'
      body = 'Action is the only thing allowed to be ink-black. There is no accent color and no tinted hover state.'
      meta = 'Color'

    [[params.folio.footerColumns]]
      title = 'Folio'
      [[params.folio.footerColumns.links]]
        name = 'Index'
        url = '/'
      [[params.folio.footerColumns.links]]
        name = 'Notes'
        url = '/posts/'
    [[params.folio.footerColumns]]
      title = 'System'
      [[params.folio.footerColumns.links]]
        name = 'Tags'
        url = '/tags/'
