baseURL = 'https://example.org/'
title = 'Folio'
theme = 'folio'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# Page-bundle originals are not published. Hugo copies every bundle resource
# into public/ by default, so the multi-megabyte source PNGs shipped alongside
# their own optimized derivatives. With this off, a resource is published only
# when something calls .RelPermalink on it — which the processed variants do
# and the untouched originals do not.
[[cascade]]
  [cascade.build]
    publishResources = false

# Root [params] holds only what is the same in every language. Hugo deep-merges
# this map into each [languages.<lang>.params], so a key set here reaches all
# three languages — that is also how hugo.system.toml's systemTypography
# override still lands after the split.
#
# Translatable strings must NOT live here. A key present in root would silently
# render English on a language that forgot to translate it, which is exactly the
# failure this layout is meant to surface.
[params]

  # Image delivery. AVIF first with a WebP fallback; no original-format
  # source, so WebP is the floor. That excludes only pre-2020 browsers and
  # avoids building the ~1.6 MB PNG variants a third source would need.
  #
  # quality is now only a FALLBACK, for images with no measurement on
  # record. The real value comes per image from data/imagequality.json,
  # written by `tools/measure-image-quality.py --write-data` and read by
  # partials/image.html: each image gets the cheapest q that still holds
  # SSIM >= 0.92 against a lossless reference.
  #
  # That indirection is worth its weight. Reaching the same floor takes
  # q25 on a soft gradient and q70 on a fine-grained texture, so any single
  # value either wastes bytes on the easy images or leaves the hard ones
  # visibly broken. Measured on the field-notes article, per-image
  # targeting ships 382,268 B where a global q70 — the cheapest global
  # setting that clears the floor everywhere — ships 759,996 B.
  #
  # 50 is kept as the fallback for the same reason it was chosen before: it
  # holds the photographic cases at SSIM 0.919-0.954 (q45 dropped a texture
  # to 0.654). Re-run the tool after adding images; an explicit `quality`
  # passed to partials/image.html still overrides everything.
  [params.images]
    quality = 50
    widths = [320, 480, 640, 800, 1200]

  [params.folio]
    # Not translatable: an image path, identical in every language.
    heroImage = 'images/folio-sketchbooks-stem.png'

# Default language at /posts/<slug>/, translations at /<lang>/posts/<slug>/
#
# Every translatable string lives under [languages.<lang>.params]. Note that
# Hugo REPLACES arrays wholesale rather than merging them element-wise, so each
# language must repeat `features`, `principles` and `footerColumns` in full —
# including the non-translatable `icon` and `url` keys. Omitting a key from one
# language's array entry drops it silently.
[languages]

  [languages.en]
    locale = 'en-US'
    label = 'English'
    title = 'Folio'
    weight = 1

    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Index'
        pageRef = '/'
        weight = 10
      [[languages.en.menus.main]]
        name = 'Notes'
        pageRef = '/posts'
        weight = 20

    [languages.en.params]
      description = 'A quieter way to put things on paper.'

      [languages.en.params.folio]
        volume = 'Volume 01 · 2026'
        headline = 'A quieter way<br>to put things on <em>paper</em>.'
        subtitle = 'Folio is a small, monochrome system for editorial product work. Bone paper, hairline borders, one serif marquee — and nothing else asking for attention.'
        features = [
          'One warm neutral. One ink. No accent colors.',
          'Instrument Serif for marquee, system UI for everything else.',
          '1px hairlines carry every separation.',
          'A single four-point spark, used sparingly.',
        ]
        hint = 'One downloaded family, one system stack.'
        heroImageCaption = 'Plate I — Reading shelf'
        tagline = 'A quiet, paper-thin design system. Made on a desk by a window, not in a war room.'
        principlesTitle = 'Three quiet rules.'
        principlesIntro = 'Folio is small on purpose. The whole system runs on a handful of decisions that never get spent on decoration.'

        [languages.en.params.folio.primaryAction]
          name = 'Read the notes'
          url = '/posts/'
        [languages.en.params.folio.secondaryAction]
          name = 'View the tags'
          url = '/tags/'

        [[languages.en.params.folio.principles]]
          icon = 'feather'
          title = 'Set in serif.'
          body = 'Headlines live in Instrument Serif from 32 to 96 pixels. Body uses the native system UI sans at 400/500.'
          meta = 'Type'
        [[languages.en.params.folio.principles]]
          icon = 'minus'
          title = 'Built on hairlines.'
          body = 'Every divider, card edge, input outline, and table line is a single Mist pixel. Depth is contrast, not shadow.'
          meta = 'Structure'
        [[languages.en.params.folio.principles]]
          icon = 'layers'
          title = 'One ink only.'
          body = 'Action is the only thing allowed to be ink-black. There is no accent color and no tinted hover state.'
          meta = 'Color'

        [[languages.en.params.folio.footerColumns]]
          title = 'Folio'
          [[languages.en.params.folio.footerColumns.links]]
            name = 'Index'
            url = '/'
          [[languages.en.params.folio.footerColumns.links]]
            name = 'Notes'
            url = '/posts/'
        [[languages.en.params.folio.footerColumns]]
          title = 'System'
          [[languages.en.params.folio.footerColumns.links]]
            name = 'Tags'
            url = '/tags/'

  [languages.mg]
    locale = 'mg-MG'
    label = 'Malagasy'
    title = 'Folio'
    weight = 2

    [languages.mg.menus]
      [[languages.mg.menus.main]]
        name = 'Fandraisana'
        pageRef = '/'
        weight = 10
      [[languages.mg.menus.main]]
        name = 'Fanamarihana'
        pageRef = '/posts'
        weight = 20

    # Basic ("...") strings throughout: TOML literal strings cannot contain an
    # apostrophe at all, and there is no escape for one inside them.
    [languages.mg.params]
      description = "Fomba mangina kokoa hametrahana zavatra an-taratasy."

      [languages.mg.params.folio]
        volume = "Boky 01 · 2026"
        headline = "Fomba mangina kokoa<br>hametrahana zavatra an-<em>taratasy</em>."
        subtitle = "Folio dia rafitra kely tokan-doko ho an'ny asa vokatra fanaovan-gazety. Taratasy taolana, sisiny tsipika manify, endri-tsoratra serif tokana — ary tsy misy zavatra hafa mitady saina."
        features = [
          "Loko malefaka iray. Ranomainty iray. Tsy misy loko fanamafisana.",
          "Instrument Serif ho an'ny lohateny, ny rafitra ho an'ny ambiny rehetra.",
          "Tsipika iray piksely no mizara ny rehetra.",
          "Pitik'afo tokana efa-jorony, ampiasaina am-pitandremana.",
        ]
        hint = "Fianakaviana endri-tsoratra iray nalaina, rafitra iray."
        heroImageCaption = "Sary I — Talantalana famakiana"
        tagline = "Rafitra famolavolana mangina, manify toy ny taratasy. Namboarina teo ambony latabatra akaikin'ny varavarankely, fa tsy tao an-trano fivoriana."
        principlesTitle = "Fitsipika telo mangina."
        principlesIntro = "Kely an-kalalahana ny Folio. Ny rafitra manontolo dia mihazona amin'ny fanapahan-kevitra vitsivitsy izay tsy lany amin'ny haingo."

        [languages.mg.params.folio.primaryAction]
          name = "Vakio ny fanamarihana"
          url = "/mg/posts/"
        [languages.mg.params.folio.secondaryAction]
          name = "Jereo ny marika"
          url = "/mg/tags/"

        [[languages.mg.params.folio.principles]]
          icon = "feather"
          title = "Voasoratra amin'ny serif."
          body = "Ny lohateny dia amin'ny Instrument Serif, 32 ka hatramin'ny 96 piksely. Ny votoaty dia mampiasa ny sans an'ny rafitra amin'ny 400/500."
          meta = "Endri-tsoratra"
        [[languages.mg.params.folio.principles]]
          icon = "minus"
          title = "Naorina amin'ny tsipika manify."
          body = "Ny mpampisaraka, sisin-karatra, faritry ny saha ary tsipiky ny tabilao rehetra dia piksely Mist tokana. Ny halalina dia avy amin'ny fifanoherana, fa tsy amin'ny aloka."
          meta = "Rafitra"
        [[languages.mg.params.folio.principles]]
          icon = "layers"
          title = "Ranomainty tokana."
          body = "Ny hetsika ihany no mahazo alalana ho mainty ranomainty. Tsy misy loko fanamafisana na endrika hover misy loko."
          meta = "Loko"

        [[languages.mg.params.folio.footerColumns]]
          title = "Folio"
          [[languages.mg.params.folio.footerColumns.links]]
            name = "Fandraisana"
            url = "/mg/"
          [[languages.mg.params.folio.footerColumns.links]]
            name = "Fanamarihana"
            url = "/mg/posts/"
        [[languages.mg.params.folio.footerColumns]]
          title = "Rafitra"
          [[languages.mg.params.folio.footerColumns.links]]
            name = "Marika"
            url = "/mg/tags/"

  [languages.fr]
    locale = 'fr-FR'
    label = 'Français'
    title = 'Folio'
    weight = 3

    [languages.fr.menus]
      [[languages.fr.menus.main]]
        name = 'Accueil'
        pageRef = '/'
        weight = 10
      [[languages.fr.menus.main]]
        name = 'Notes'
        pageRef = '/posts'
        weight = 20

    [languages.fr.params]
      description = "Une façon plus discrète de coucher les choses sur le papier."

      [languages.fr.params.folio]
        volume = "Volume 01 · 2026"
        headline = "Une façon plus discrète<br>de coucher les choses sur le <em>papier</em>."
        subtitle = "Folio est un petit système monochrome pour le travail produit éditorial. Papier os, filets d'un pixel, un seul serif en vedette — et rien d'autre qui réclame l'attention."
        features = [
          "Un seul neutre chaud. Une seule encre. Aucune couleur d'accent.",
          "Instrument Serif pour les titres, l'interface système pour tout le reste.",
          "Des filets d'un pixel portent chaque séparation.",
          "Une seule étincelle à quatre branches, utilisée avec parcimonie.",
        ]
        hint = "Une famille téléchargée, une pile système."
        heroImageCaption = "Planche I — Étagère de lecture"
        tagline = "Un système de design discret, fin comme du papier. Conçu à un bureau près d'une fenêtre, pas dans une salle de crise."
        principlesTitle = "Trois règles discrètes."
        principlesIntro = "Folio est petit à dessein. Tout le système tient sur une poignée de décisions qui ne sont jamais dépensées en décoration."

        [languages.fr.params.folio.primaryAction]
          name = "Lire les notes"
          url = "/fr/posts/"
        [languages.fr.params.folio.secondaryAction]
          name = "Voir les étiquettes"
          url = "/fr/tags/"

        [[languages.fr.params.folio.principles]]
          icon = "feather"
          title = "Composé en serif."
          body = "Les titres vivent en Instrument Serif, de 32 à 96 pixels. Le corps de texte utilise le sans natif de l'interface système en 400/500."
          meta = "Typographie"
        [[languages.fr.params.folio.principles]]
          icon = "minus"
          title = "Bâti sur des filets."
          body = "Chaque séparateur, bord de carte, contour de champ et ligne de tableau est un unique pixel Mist. La profondeur naît du contraste, pas de l'ombre."
          meta = "Structure"
        [[languages.fr.params.folio.principles]]
          icon = "layers"
          title = "Une seule encre."
          body = "L'action est la seule chose autorisée à être noir d'encre. Il n'y a ni couleur d'accent ni état de survol teinté."
          meta = "Couleur"

        [[languages.fr.params.folio.footerColumns]]
          title = "Folio"
          [[languages.fr.params.folio.footerColumns.links]]
            name = "Accueil"
            url = "/fr/"
          [[languages.fr.params.folio.footerColumns.links]]
            name = "Notes"
            url = "/fr/posts/"
        [[languages.fr.params.folio.footerColumns]]
          title = "Système"
          [[languages.fr.params.folio.footerColumns.links]]
            name = "Étiquettes"
            url = "/fr/tags/"
