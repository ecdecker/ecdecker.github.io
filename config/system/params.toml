# The no-download typography treatment, for comparison against the default.
# Layer it over config/_default/ with:
#
#   hugo server --environment system
#
# (Before the config split this was hugo.system.toml, layered via
# `--config hugo.toml,hugo.system.toml`. That form no longer works: --config
# does not disable the config directory, so config/_default/ loaded anyway.)
#
# This is a root [params] map, so it deep-merges into all three languages.
# Hugo lowercases the key on the way in, which is why footer.html and
# baseof.html reach it through `isset . "systemtypography"`.
[folio]
  systemTypography = true
