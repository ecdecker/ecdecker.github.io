# Navigation labels for this language.
#
# Links are menu entries rather than copy because a link is a name plus a
# destination, and only the name is translatable. `pageRef` lets Hugo resolve
# the destination in the current language, which is what removed the hardcoded
# '/fr/posts/' and '/mg/posts/' these files used to repeat -- a translator
# supplies the words and nothing else.

[[main]]
  name = 'Posts'
  pageRef = '/posts'
  weight = 10

# Research is a page of direct downloads rather than a list of articles: it
# links straight to files mirrored from Box under /box/research/. It is still
# an ordinary menu entry, so pageRef resolves /research/, /fr/research/ and
# /mg/research/ from the one spelling here.
[[main]]
  name = 'Research'
  pageRef = '/research'
  weight = 20

# Homepage call-to-action buttons. The research-notes link lives on the
# notebook card itself.
[[home]]
  name = 'Semantic Scholar'
  url = 'https://www.semanticscholar.org/author/Emily-Decker/2346865864'
  weight = 10

# Identifier 'duke' is matched in home.html to render this one button with
# the Duke wordmark and Duke Blue -- the site's one deliberate exception to
# its otherwise warm-monochrome palette.
[[home]]
  identifier = 'duke'
  name = 'Duke University Research Profile'
  url = 'https://scholars.duke.edu/person/Emily.Decker'
  weight = 20

# <<todo-orcid>> Uncomment with Emily's real ORCID iD in place of the zeros
# (register free at https://orcid.org/register) -- see docs/SITE-OWNER.md
# for the full walkthrough. No template change is needed: home.html's CTA
# loop already renders any [[home]] entry with rel="me", which is also the
# reciprocal half of ORCID's own site-verification feature.
