# Footer columns. A parent entry is the column heading and carries no
# destination of its own; its children are the links.
[[footer]]
  identifier = 'folio'
  name = 'Emily Decker'
  weight = 10

[[footer]]
  parent = 'folio'
  name = 'Index'
  pageRef = '/'
  weight = 11

[[footer]]
  parent = 'folio'
  name = 'Posts'
  pageRef = '/posts'
  weight = 12

[[footer]]
  identifier = 'system'
  name = 'Site'
  weight = 20

[[footer]]
  parent = 'system'
  name = 'Tags'
  pageRef = '/tags'
  weight = 21

# Written in English only and linked from every language on purpose, so this
# one takes a literal url rather than a pageRef -- pageRef resolves to nothing
# in a language the page does not exist in.
[[footer]]
  parent = 'system'
  name = 'Socially Engineered'
  url = '/socially-engineered/'
  weight = 22
