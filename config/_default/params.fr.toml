description = "Une façon plus discrète de coucher les choses sur le papier."

[folio]
  volume = "Volume 01 · 2026"
  headline = "Une façon plus discrète<br>de coucher les choses sur le <em>papier</em>."
  subtitle = "Folio est un petit système monochrome pour le travail produit éditorial. Papier os, filets d'un pixel, un seul serif en vedette — et rien d'autre qui réclame l'attention."
  features = [
    "Un seul neutre chaud. Une seule encre. Aucune couleur d'accent.",
    "Instrument Serif pour les titres, l'interface système pour tout le reste.",
    "Des filets d'un pixel portent chaque séparation.",
    "Une seule étincelle à quatre branches, utilisée avec parcimonie.",
  ]
  hint = "Une famille téléchargée, une pile système."
  heroImageCaption = "Planche I — Étagère de lecture"
  tagline = "Un système de design discret, fin comme du papier. Conçu à un bureau près d'une fenêtre, pas dans une salle de crise."
  principlesTitle = "Trois règles discrètes."
  principlesIntro = "Folio est petit à dessein. Tout le système tient sur une poignée de décisions qui ne sont jamais dépensées en décoration."

  [folio.primaryAction]
    name = "Lire les notes"
    url = "/fr/posts/"
  [folio.secondaryAction]
    name = "Voir les étiquettes"
    url = "/fr/tags/"

  [[folio.principles]]
    icon = "feather"
    title = "Composé en serif."
    body = "Les titres vivent en Instrument Serif, de 32 à 96 pixels. Le corps de texte utilise le sans natif de l'interface système en 400/500."
    meta = "Typographie"
  [[folio.principles]]
    icon = "minus"
    title = "Bâti sur des filets."
    body = "Chaque séparateur, bord de carte, contour de champ et ligne de tableau est un unique pixel Mist. La profondeur naît du contraste, pas de l'ombre."
    meta = "Structure"
  [[folio.principles]]
    icon = "layers"
    title = "Une seule encre."
    body = "L'action est la seule chose autorisée à être noir d'encre. Il n'y a ni couleur d'accent ni état de survol teinté."
    meta = "Couleur"

  [[folio.footerColumns]]
    title = "Folio"
    [[folio.footerColumns.links]]
      name = "Accueil"
      url = "/fr/"
    [[folio.footerColumns.links]]
      name = "Notes"
      url = "/fr/posts/"
  [[folio.footerColumns]]
    title = "Système"
    [[folio.footerColumns.links]]
      name = "Étiquettes"
      url = "/fr/tags/"
