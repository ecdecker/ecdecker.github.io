# Basic ("...") strings throughout: TOML literal strings cannot contain an
# apostrophe at all, and there is no escape for one inside them.
description = "Fomba mangina kokoa hametrahana zavatra an-taratasy."

[folio]
  volume = "Boky 01 · 2026"
  headline = "Fomba mangina kokoa<br>hametrahana zavatra an-<em>taratasy</em>."
  subtitle = "Folio dia rafitra kely tokan-doko ho an'ny asa vokatra fanaovan-gazety. Taratasy taolana, sisiny tsipika manify, endri-tsoratra serif tokana — ary tsy misy zavatra hafa mitady saina."
  features = [
    "Loko malefaka iray. Ranomainty iray. Tsy misy loko fanamafisana.",
    "Instrument Serif ho an'ny lohateny, ny rafitra ho an'ny ambiny rehetra.",
    "Tsipika iray piksely no mizara ny rehetra.",
    "Pitik'afo tokana efa-jorony, ampiasaina am-pitandremana.",
  ]
  hint = "Fianakaviana endri-tsoratra iray nalaina, rafitra iray."
  heroImageCaption = "Sary I — Talantalana famakiana"
  tagline = "Rafitra famolavolana mangina, manify toy ny taratasy. Namboarina teo ambony latabatra akaikin'ny varavarankely, fa tsy tao an-trano fivoriana."
  principlesTitle = "Fitsipika telo mangina."
  principlesIntro = "Kely an-kalalahana ny Folio. Ny rafitra manontolo dia mihazona amin'ny fanapahan-kevitra vitsivitsy izay tsy lany amin'ny haingo."

  [folio.primaryAction]
    name = "Vakio ny fanamarihana"
    url = "/mg/posts/"
  [folio.secondaryAction]
    name = "Jereo ny marika"
    url = "/mg/tags/"

  [[folio.principles]]
    icon = "feather"
    title = "Voasoratra amin'ny serif."
    body = "Ny lohateny dia amin'ny Instrument Serif, 32 ka hatramin'ny 96 piksely. Ny votoaty dia mampiasa ny sans an'ny rafitra amin'ny 400/500."
    meta = "Endri-tsoratra"
  [[folio.principles]]
    icon = "minus"
    title = "Naorina amin'ny tsipika manify."
    body = "Ny mpampisaraka, sisin-karatra, faritry ny saha ary tsipiky ny tabilao rehetra dia piksely Mist tokana. Ny halalina dia avy amin'ny fifanoherana, fa tsy amin'ny aloka."
    meta = "Rafitra"
  [[folio.principles]]
    icon = "layers"
    title = "Ranomainty tokana."
    body = "Ny hetsika ihany no mahazo alalana ho mainty ranomainty. Tsy misy loko fanamafisana na endrika hover misy loko."
    meta = "Loko"

  [[folio.footerColumns]]
    title = "Folio"
    [[folio.footerColumns.links]]
      name = "Fandraisana"
      url = "/mg/"
    [[folio.footerColumns.links]]
      name = "Fanamarihana"
      url = "/mg/posts/"
  [[folio.footerColumns]]
    title = "Rafitra"
    [[folio.footerColumns.links]]
      name = "Marika"
      url = "/mg/tags/"
