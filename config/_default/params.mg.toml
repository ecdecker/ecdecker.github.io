# Site-wide chrome for this language. Homepage copy lives as Markdown in
# content/_index.mg.md, and footer links in menus.mg.toml.
#
# Basic ("...") strings throughout: TOML literal strings cannot contain an
# apostrophe at all, and there is no escape for one inside them. Malagasy prose
# is full of them, which is one reason the copy is better off in Markdown.

description = "Fomba mangina kokoa hametrahana zavatra an-taratasy."

[folio]
  tagline = "Rafitra famolavolana mangina, manify toy ny taratasy. Namboarina teo ambony latabatra akaikin'ny varavarankely, fa tsy tao an-trano fivoriana."
