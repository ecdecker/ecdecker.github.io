baseURL = 'https://blog.emilycdecker.com/'
title = 'Emily Decker'
theme = 'folio'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# Box is an offline authoring input. The sync command mirrors only referenced
# files beneath imports/box using their absolute site paths; Hugo merely mounts
# that checked-in snapshot as static data and never contacts Box.
[module]
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "imports/box"
  target = "static"

# The Box snapshot is mounted into assets as well as static. Static delivers
# the file at its public path; assets is what layouts/_markup/render-link.html
# resolves against to annotate a link with its file type and size, which the
# site promises for every dataset and paper. Declaring any assets mount
# replaces Hugo's default, so the ordinary assets directory is named too --
# without it resources.Get in brand.html finds nothing.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "imports/box"
  target = "assets"

# Page-bundle originals are not published. Hugo copies every bundle resource
# into public/ by default, so the multi-megabyte source PNGs shipped alongside
# their own optimized derivatives. With this off, a resource is published only
# when something calls .RelPermalink on it — which the processed variants do
# and the untouched originals do not.
[[cascade]]
  [cascade.build]
    publishResources = false
