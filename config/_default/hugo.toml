baseURL = 'https://emilycdecker.com/'
title = 'Emily'
theme = 'folio'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# Box is an offline authoring input. The sync command mirrors only referenced
# files beneath imports/box using their absolute site paths; Hugo merely mounts
# that checked-in snapshot as static data and never contacts Box.
[module]
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "imports/box"
  target = "static"

# Page-bundle originals are not published. Hugo copies every bundle resource
# into public/ by default, so the multi-megabyte source PNGs shipped alongside
# their own optimized derivatives. With this off, a resource is published only
# when something calls .RelPermalink on it — which the processed variants do
# and the untouched originals do not.
[[cascade]]
  [cascade.build]
    publishResources = false
